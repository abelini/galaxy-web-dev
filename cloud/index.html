<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Galaxy Web Cloud</title>
  <meta name="description" content="Galaxy Web Cloud." />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background-color: #050816;
      color: #e2e8f0;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }
    /* Mismo fondo que la landing principal */
    .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .bg-glow {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at top, #1e1b4b 0%, #050816 60%);
    }
    .bg-binary {
      position: absolute; inset: 0;
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }
    main { text-align: center; padding: 2rem 1.5rem; }
    .logo {
      width: 340px;
      height: 340px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 0 45px rgba(124, 58, 237, 0.45));
      animation: float 6s ease-in-out infinite;
    }
    h1 {
      color: #fff;
      font-weight: 700;
      font-size: 4.75rem;
      letter-spacing: 0.02em;
      margin-top: 1.75rem;
    }
    .cloud {
      font-family: "Orbitron", ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 2.5rem;
      letter-spacing: 0.55em;
      /* compensa el tracking para que quede ópticamente centrado */
      text-indent: 0.55em;
      margin-top: 0;
      background: linear-gradient(100deg, #a78bfa 10%, #e879f9 35%, #67e8f9 60%, #a78bfa 90%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s linear infinite, breathe 3.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      to { background-position: 220% center; }
    }
    @keyframes breathe {
      0%, 100% {
        filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.55)) drop-shadow(0 0 42px rgba(34, 211, 238, 0.30));
      }
      50% {
        filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.85)) drop-shadow(0 0 70px rgba(34, 211, 238, 0.50));
      }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (max-width: 640px) {
      .logo { width: 200px; height: 200px; }
      h1 { font-size: 2.5rem; }
      .cloud { font-size: 1.4rem; letter-spacing: 0.4em; text-indent: 0.4em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .cloud { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-glow"></div>
    <canvas class="bg-binary" id="bg-binary"></canvas>
  </div>
  <main>
    <img class="logo" src="logo.png" alt="Galaxy Web" width="340" height="340" />
    <h1>Galaxy Web</h1>
    <div class="cloud">CLOUD</div>
  </main>
  <script>
    (() => {
      const canvas = document.getElementById("bg-binary");
      const ctx = canvas.getContext("2d");
      // Paleta a juego con el logo / texto CLOUD
      const COLORS = ["#a78bfa", "#e879f9", "#67e8f9"];
      const N = 160; // densidad sutil
      let w = 0, h = 0, cx = 0, cy = 0;
      let parts = [];

      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

      function spawn(p, far) {
        // Posicion angular random, z = profundidad (1 = lejos, 0 = cerca)
        const a = Math.random() * Math.PI * 2;
        const r = 0.15 + Math.random() * 0.85; // evita el centro exacto
        p.x = Math.cos(a) * r;
        p.y = Math.sin(a) * r;
        p.z = far ? 0.6 + Math.random() * 0.4 : Math.random();
        p.ch = Math.random() < 0.5 ? "0" : "1";
        p.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        p.speed = 0.05 + Math.random() * 0.1; // avance hacia ti (z -> 0)
        p.flick = Math.random() * Math.PI * 2;
      }

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        cx = w / 2; cy = h / 2;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        parts = [];
        for (let i = 0; i < N; i++) {
          const p = {};
          spawn(p, false);
          parts.push(p);
        }
        ctx.fillStyle = "#050816";
        ctx.fillRect(0, 0, w, h);
      }

      function frame(dt, t) {
        // Estela suave para movimiento fluido
        ctx.fillStyle = "rgba(5, 8, 22, 0.18)";
        ctx.fillRect(0, 0, w, h);
        const scale = Math.min(w, h) * 0.55;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (const p of parts) {
          p.z -= p.speed * dt;
          if (p.z <= 0.03) { spawn(p, true); continue; }
          if (Math.random() < 0.005) p.ch = p.ch === "0" ? "1" : "0";
          const depth = 1 - p.z; // 0 lejos -> 1 cerca
          const sx = cx + (p.x / p.z) * scale * 0.35;
          const sy = cy + (p.y / p.z) * scale * 0.35;
          if (sx < -30 || sx > w + 30 || sy < -30 || sy > h + 30) {
            spawn(p, true); continue;
          }
          const size = 8 + depth * 18;
          const alpha = 0.02 + depth * 0.28;
          ctx.font = size + 'px ui-monospace, "JetBrains Mono", monospace';
          ctx.shadowBlur = 6 * depth;
          ctx.shadowColor = p.color;
          ctx.fillStyle = p.color;
          // Parpadeo leve para que se sienta vivo
          ctx.globalAlpha = alpha * (0.8 + 0.2 * Math.sin(t * 2 + p.flick));
          ctx.fillText(p.ch, sx, sy);
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
      }

      resize();
      addEventListener("resize", resize);

      if (reduced) {
        ctx.font = '14px ui-monospace, monospace';
        ctx.textAlign = "center";
        for (let n = 0; n < 200; n++) {
          ctx.fillStyle = COLORS[n % COLORS.length];
          ctx.globalAlpha = 0.12 + Math.random() * 0.15;
          ctx.fillText(Math.random() < 0.5 ? "0" : "1",
            Math.random() * w, Math.random() * h);
        }
        ctx.globalAlpha = 1;
        return;
      }

      let last = performance.now();
      const loop = (now) => {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        frame(dt, now / 1000);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
