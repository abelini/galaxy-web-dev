<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Galaxy Web Cloud</title>
  <meta name="description" content="Galaxy Web Cloud." />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background-color: #050816;
      color: #e2e8f0;
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }
    /* Mismo fondo que la landing principal */
    .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .bg-glow {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at top, #1e1b4b 0%, #050816 60%);
    }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }
    main { text-align: center; padding: 2rem 1.5rem; }
    .logo {
      width: 340px;
      height: 340px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 0 45px rgba(124, 58, 237, 0.45));
      animation: float 6s ease-in-out infinite;
    }
    h1 {
      color: #fff;
      font-weight: 700;
      font-size: 4.75rem;
      letter-spacing: 0.02em;
      margin-top: 1.75rem;
    }
    .cloud {
      font-family: "Orbitron", ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      font-size: 2.5rem;
      letter-spacing: 0.55em;
      /* compensa el tracking para que quede ópticamente centrado */
      text-indent: 0.55em;
      margin-top: 0;
      background: linear-gradient(100deg, #a78bfa 10%, #e879f9 35%, #67e8f9 60%, #a78bfa 90%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s linear infinite, breathe 3.5s ease-in-out infinite;
    }
    @keyframes shimmer {
      to { background-position: 220% center; }
    }
    @keyframes breathe {
      0%, 100% {
        filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.55)) drop-shadow(0 0 42px rgba(34, 211, 238, 0.30));
      }
      50% {
        filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.85)) drop-shadow(0 0 70px rgba(34, 211, 238, 0.50));
      }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @media (max-width: 640px) {
      .logo { width: 200px; height: 200px; }
      h1 { font-size: 2.5rem; }
      .cloud { font-size: 1.4rem; letter-spacing: 0.4em; text-indent: 0.4em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .cloud { animation: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>
  </div>
  <main>
    <img class="logo" src="logo.png" alt="Galaxy Web" width="340" height="340" />
    <h1>Galaxy Web</h1>
    <div class="cloud">CLOUD</div>
  </main>
</body>
</html>
